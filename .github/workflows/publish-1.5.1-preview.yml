name: Publish tested 1.5.1 preview
on:
  push:
    branches: [release/wakemini-1.5.1-preview]
    paths: [.github/workflows/publish-1.5.1-preview.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact tested preview archive
        uses: actions/download-artifact@v4
        with:
          name: WakeMini-1.5.1-preview
          path: release
          run-id: 42466908092
          github-token: ${{ github.token }}
      - name: Repackage exact delivered contents and verify hashes
        run: |
          echo '7d8eb71cc9db4b77c976e53d84fd2154654584cd533ae5eb86cfbf30ad849514  release/WakeMini-1.5.1-preview.zip' | sha256sum -c -
          python -m zipfile -t release/WakeMini-1.5.1-preview.zip
      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          Проверочная сборка Wake Mini 1.5.1: Windows-помощник, расширение Chrome, облачная функция Алисы и инструкция.
          
          Запуск и завершение голосового разговора ChatGPT через расширение, без API-ключа. Chrome нужно оставить запущенным. Работа без переключения окна игры на ПК пользователя ещё не подтверждена.
          
          Архив взят без изменений из успешной проверочной сборки 42466908092 (исходники: 24306ea3c2046891efb9b96cbf49403b7077e89e). SHA-256 всего ZIP сверяется с ранее предоставленным архивом. Android обновлять не требуется. Инструкция обновления находится внутри ZIP.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.1-preview
          name: Wake Mini 1.5.1 — проверочная сборка
          target_commitish: 24306ea3c2046891efb9b96cbf49403b7077e89e
          prerelease: true
          make_latest: false
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true
