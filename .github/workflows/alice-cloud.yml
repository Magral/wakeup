name: Build Alice cloud integration
on:
  push:
    branches: [main]
    paths:
      - 'alice-cloud/**'
      - '.github/workflows/alice-cloud.yml'
permissions:
  contents: write
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test cloud handler and UDP protocol
        run: python -m unittest discover -s alice-cloud/tests -v
      - name: Package function
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('WakeMini-Alice-Cloud-1.0.1.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in ['main.py', 'README.md', 'environment.example.json']:
                  archive.write(Path('alice-cloud') / name, name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: WakeMini-Alice-Cloud
          path: WakeMini-Alice-Cloud-1.0.1.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: alice-cloud-v1.0.1
          name: Wake Mini — интеграция с Алисой 1.0.1
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Облачный обработчик для приватного навыка умного дома Яндекса.
            Дополнительное постоянно включённое устройство дома не требуется.
            ZIP загружается в Yandex Cloud Functions: Python 3.12, main.handler.
            Настройка OAuth и облака: alice-cloud/README.md в репозитории и внутри ZIP.
            Локальные тесты UDP и авторизации пройдены. Проверка с реальным роутером и публикация навыка выполняются после настройки облака.
            APK и Windows-помощник 1.1.1 заменять не требуется.
          files: WakeMini-Alice-Cloud-1.0.1.zip
          fail_on_unmatched_files: true
