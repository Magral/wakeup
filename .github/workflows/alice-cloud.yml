name: Build Alice cloud integration and Windows helper
on:
  push:
    branches: [main]
    paths:
      - 'alice-cloud/**'
      - 'pc-agent/**'
      - '.github/workflows/alice-cloud.yml'
permissions:
  contents: write
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test cloud handler and UDP protocol
        run: python -m unittest discover -s alice-cloud/tests -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows helper
        run: dotnet publish pc-agent/WakeMiniAgent.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/win-x64
      - name: Package function
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('WakeMini-Alice-Cloud-1.2.1.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in ['main.py', 'README.md', 'environment.example.json']:
                  archive.write(Path('alice-cloud') / name, name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: WakeMini-Alice-1.2.1
          path: |
            WakeMini-Alice-Cloud-1.2.1.zip
            publish/win-x64/WakeMiniAgent.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: alice-cloud-v1.2.1
          name: Wake Mini — Алиса и Windows-помощник 1.2.1
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Добавлены запуск выбранного приложения голосом и режим работы Windows-помощника в трее.
            В релизе два файла: ZIP облачной функции и обновлённый WakeMiniAgent.exe. APK Android не менялся.
            Настройка обновления облачной функции: alice-cloud/README.md.
          files: |
            WakeMini-Alice-Cloud-1.2.1.zip
            publish/win-x64/WakeMiniAgent.exe
          fail_on_unmatched_files: true
