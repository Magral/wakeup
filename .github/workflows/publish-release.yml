name: Publish Wake Mini release

on:
  push:
    branches: [main]
    paths:
      - .github/release-trigger

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Build Windows helper
        run: dotnet publish pc-agent/WakeMiniAgent.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/win-x64

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WakeMini-1.1.1.apk

      - name: Read release tag
        id: release_meta
        run: echo "tag=$(tr -d '\r\n' < .github/release-trigger)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Wake Mini ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Кнопка и виджет переключают ПК: при ответе Windows-помощника отправляется команда выключения, при отсутствии ответа — Wake-on-LAN пакет.

            Для управления установите WakeMiniAgent.exe на Windows ПК, введите его ключ в приложении и оставьте помощник запущенным. Инструкции есть в README репозитория.
          files: |
            app/build/outputs/apk/debug/WakeMini-1.1.1.apk
            publish/win-x64/WakeMiniAgent.exe
            Allow-WakeMini-Firewall.bat
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
