name: Publish Wake Mini release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/release-trigger]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key
        id: signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wakemini.jks"
            chmod 600 "$RUNNER_TEMP/wakemini.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wakemini.jks" >> "$GITHUB_ENV"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Android signing secrets are missing. Windows and cloud will be published; Android APK will NOT be published with an ephemeral key.'
          fi
      - name: Verify protocol
        run: |
          python -m unittest discover -s alice-cloud/tests -v
          dotnet run --project tests/protocol/ProtocolTests.csproj
      - name: Build Android release
        run: gradle assembleRelease
      - name: Build Windows helper
        run: dotnet publish pc-agent/WakeMiniAgent.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/win-x64
      - name: Stage release assets
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p release
          cp publish/win-x64/WakeMiniAgent.exe release/
          cp scripts/Setup-WakeMini-Signing.ps1 release/
          cp Allow-WakeMini-Firewall.bat release/
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('release/WakeMini-Alice-Cloud-1.3.0.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in ['main.py','README.md','environment.example.json']:
                  z.write(Path('alice-cloud')/name,name)
          PY
          if [ "$SIGNED" = true ]; then
            cp app/build/outputs/apk/release/app-release.apk release/WakeMini-1.3.0.apk
            echo 'Android 1.3.0 подписан постоянным ключом. Windows-помощник и облачный обработчик: 1.3.0. QR-настройка, профили, диагностика и повтор подтверждений без повторного выполнения. Инструкции в README.' > release-notes.md
          else
            echo 'Windows-помощник и облачный обработчик 1.3.0 готовы. Android-код собран, но устанавливаемый APK появится после настройки постоянной подписи: scripts/Setup-WakeMini-Signing.ps1. Прежний APK 1.1.3 остаётся в своём релизе. Инструкции в README.' > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Wake Mini 1.3.0
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/wakemini.jks"
