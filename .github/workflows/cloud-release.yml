name: Release cloud 1.7.2
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud-release:
    if: contains(github.event.head_commit.message, '[release-cloud-1.7.2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify cloud handler
        run: python -m unittest discover -s alice-cloud/tests -v
      - name: Package cloud update
        run: python scripts/package-cloud.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.2
          name: Wake Mini 1.7.2 — облачный поиск игр
          target_commitish: ${{ github.sha }}
          body_path: docs/UPDATE-CLOUD-1.7.2.md
          files: publish/cloud/*
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: false
