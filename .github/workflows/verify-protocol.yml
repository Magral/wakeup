name: Verify command protocol
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/protocol/ProtocolTests.csproj
      - run: dotnet run --project tests/tv/TvTests.csproj
      - run: dotnet run --project tests/chat/ChatTests.csproj
      - run: node --test tests/chat/voice-*.test.js
      - run: python -m unittest discover -s alice-cloud/tests -v
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real agent and harmless launch counter
        run: |
          dotnet build pc-agent/WakeMiniAgent.csproj -c Release -o publish/test-agent
          dotnet build tests/protocol/ProtocolTests.csproj -c Release -r win-x64 -o publish/test-counter
      - name: Verify duplicate UDP requests never launch twice
        run: python tests/integration_agent.py publish/test-agent/WakeMiniAgent.exe publish/test-counter/ProtocolTests.exe
      - name: Verify chat sequencing and real native-host stdio on Windows
        run: dotnet run --project tests/chat/ChatTests.csproj -- publish/test-agent/WakeMiniAgent.exe
      - name: Parse Windows signing setup script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Setup-WakeMini-Signing.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Publish self-contained 1.5.4 helper
        run: dotnet publish pc-agent/WakeMiniAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/package
      - name: Package tested 1.5.4 release
        run: python scripts/package-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: WakeMini-1.5.4
          path: |
            publish/bundle/WakeMini-1.5.4.zip
            publish/bundle/WakeMini-Alice-Cloud-1.5.4.zip
            publish/bundle/SHA256SUMS.txt
          if-no-files-found: error
