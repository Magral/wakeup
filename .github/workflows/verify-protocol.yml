name: Verify command protocol
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/protocol/ProtocolTests.csproj
      - run: python -m unittest discover -s alice-cloud/tests -v
