name: Verify command protocol
on: [push, workflow_dispatch]
concurrency:
  group: verify-${{ github.ref }}-1.7.5
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/protocol/ProtocolTests.csproj
      - run: dotnet run --project tests/steam/SteamTests.csproj
      - run: dotnet run --project tests/desktop/DesktopTests.csproj
      - run: dotnet run --project tests/tv/TvTests.csproj
      - run: dotnet run --project tests/audio/AudioTests.csproj
      - run: dotnet run --project tests/power/PowerTests.csproj
      - run: dotnet run --project tests/chat/ChatTests.csproj
      - run: node --test tests/chat/voice-*.test.js
      - run: python -m unittest discover -s alice-cloud/tests -v
  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build real agent and harmless launch counter
        run: |
          dotnet build pc-agent/WakeMiniAgent.csproj -c Release -o publish/test-agent
          dotnet build tests/protocol/ProtocolTests.csproj -c Release -r win-x64 -o publish/test-counter
      - name: Verify duplicate UDP requests never launch twice
        run: python tests/integration_agent.py publish/test-agent/WakeMiniAgent.exe publish/test-counter/ProtocolTests.exe
      - name: Verify chat sequencing and real native-host stdio on Windows
        run: dotnet run --project tests/chat/ChatTests.csproj -- publish/test-agent/WakeMiniAgent.exe
      - name: Verify real Windows power-message routing without sleeping the runner
        run: dotnet run --project tests/power-windows/PowerWindowTests.csproj
      - name: Parse Windows signing setup script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/Setup-WakeMini-Signing.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Verify updater installation, rollback and locked-file recovery
        run: python tests/update/test_installer.py
      - name: Publish self-contained 1.7.5 helper
        run: dotnet publish pc-agent/WakeMiniAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/package
      - name: Package tested 1.7.5 release
        run: python scripts/package-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: WakeMini-1.7.5
          path: |
            publish/bundle/WakeMini-1.7.5.zip
            publish/bundle/WakeMini-Alice-Cloud-1.7.2.zip
            publish/bundle/SHA256SUMS.txt
          if-no-files-found: error

  android-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify widget state and render actual Android graphics
        run: |
          javac -d /tmp/widget-tests tests/widget/WidgetButtonTest.java app/src/main/java/ru/wakemini/app/WidgetButtonStyle.java
          java -cp /tmp/widget-tests ru.wakemini.app.WidgetButtonTest
          gradle testDebugUnitTest assembleDebug
      - name: Restore permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Permanent signing key missing'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wakemini.jks"
          chmod 600 "$RUNNER_TEMP/wakemini.jks"
      - name: Build APK with permanent signing certificate
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wakemini.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/cert.txt"
          python - <<'PYCODE'
          import os,re
          from pathlib import Path
          expected=Path('docs/android-signing-certificate.sha256').read_text().strip().replace(':','').lower()
          report=(Path(os.environ['RUNNER_TEMP'])/'cert.txt').read_text()
          found=re.search(r'Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)',report)
          assert found and found.group(1).lower()==expected, 'Unexpected Android signing certificate'
          PYCODE
          mkdir -p publish/android
          cp app/build/outputs/apk/release/app-release.apk publish/android/WakeMini-1.7.3.apk
          cp app/build/reports/widget-preview.png publish/android/widget-preview.png
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/wakemini.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: WakeMini-Android-1.7.3
          path: publish/android/*
          if-no-files-found: error

  release:
    # Cloud-only releases do not replace the latest Windows updater bundle.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[cloud-only]')
    needs: [protocol, windows-agent, android-widget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WakeMini-1.7.5
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: WakeMini-Android-1.7.3
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.5
          name: Wake Mini 1.7.5
          target_commitish: ${{ github.sha }}
          body_path: docs/UPDATE-1.7.5.md
          files: release/*
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
