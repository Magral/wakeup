name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify release signing with a disposable test key (not published)
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing-test.jks
          ANDROID_KEYSTORE_PASSWORD: signing-test-only
          ANDROID_KEY_ALIAS: test
          ANDROID_KEY_PASSWORD: signing-test-only
        run: |
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -alias test -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CI test only'
          gradle assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Build Windows helper
        run: dotnet build pc-agent/WakeMiniAgent.csproj --configuration Release

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WakeMini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
