plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.wakemini.app'
    compileSdk 35
    testOptions { unitTests.includeAndroidResources = true }

    signingConfigs {
        stable {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.stable
        }
    }
    defaultConfig {
        applicationId 'ru.wakemini.app'
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName '1.7.3'
    }
}

// Fixed QR decoder version supports Android 6 without raising the minimum SDK.
dependencies {
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { exclude group: 'com.google.zxing', module: 'core' }
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'androidx.core:core:1.9.0'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
